<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Averías"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json">
<title>Averías de calderas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: cabecera con buscador, tres niveles (marcas > modelos > códigos) en una sola columna ancha de 880px.
   Los códigos se muestran como en el display de una caldera: panel oscuro con dígitos verdes. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --fg:#13202a; --muted:#566772; --line:#d8dfe3;
  --accent:#c2410c; --accent-fg:#ffffff; --soft:#e8edf0;
  --lcd-bg:#0f1f1b; --lcd-fg:#a6e66b;
  --c-llama:#c2410c; --c-agua:#1d6fb8; --c-sensor:#6d5bd0; --c-humos:#5b6b76;
  --c-temp:#b42318; --c-gas:#a16207; --c-electronica:#0f766e; --c-info:#475569;
  --font-head:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-lcd:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#151d24; --fg:#e6edf1; --muted:#93a3ad; --line:#26323b;
    --accent:#f08a4b; --accent-fg:#1a0d05; --soft:#1d2831;
    --lcd-bg:#0a1512; --lcd-fg:#a6e66b;
    --c-llama:#f08a4b; --c-agua:#6db3f2; --c-sensor:#a99cf5; --c-humos:#a9b6be;
    --c-temp:#f4837b; --c-gas:#e6b84a; --c-electronica:#5ccfc2; --c-info:#94a3b8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#151d24; --fg:#e6edf1; --muted:#93a3ad; --line:#26323b;
  --accent:#f08a4b; --accent-fg:#1a0d05; --soft:#1d2831;
  --lcd-bg:#0a1512; --lcd-fg:#a6e66b;
  --c-llama:#f08a4b; --c-agua:#6db3f2; --c-sensor:#a99cf5; --c-humos:#a9b6be;
  --c-temp:#f4837b; --c-gas:#e6b84a; --c-electronica:#5ccfc2; --c-info:#94a3b8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.5 var(--font-body);
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);max-width:60ch}
.search{position:relative}
.search input{
  width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--fg);
}
.search input::placeholder{color:var(--muted)}
.warn{
  font-size:.9rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 14px;max-width:none;
}
.warn strong{color:var(--fg)}
.backbtn{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font-weight:600;font-size:.95rem;text-decoration:none;min-height:40px}
.backbtn:hover{border-color:var(--accent);color:var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.92rem;color:var(--muted);align-items:center}
.crumbs a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{color:var(--accent);border-color:var(--accent)}
.crumbs span[aria-current]{color:var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.card{
  display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);min-width:0;
}
.card:hover{border-color:var(--accent)}
.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.brands{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.brands{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bt{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;aspect-ratio:1/1;
  padding:12px;border-radius:14px;text-decoration:none;color:#fff;text-align:center;overflow:hidden;min-width:0;
  background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .12s ease}
.bt:hover{transform:translateY(-2px);filter:brightness(1.08)}
.bt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bt::after{content:"";position:absolute;inset:auto -20% -38% -20%;height:55%;border-radius:50%;background:rgba(255,255,255,.08)}
.bt .wm{font-family:var(--font-head);line-height:1.02;text-wrap:balance;overflow-wrap:anywhere;position:relative;z-index:1;max-width:100%;
  font-size:clamp(1.25rem,5.6vw,1.7rem)}
.bt .wm.long{font-size:clamp(1.05rem,4.6vw,1.35rem)}
.bt .cnt{position:relative;z-index:1;font-size:.78rem;letter-spacing:.04em;opacity:.88;background:rgba(0,0,0,.22);padding:2px 10px;border-radius:99px}
.grp{margin-top:22px}
.gh{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800;letter-spacing:.01em;padding-bottom:8px;border-bottom:2px solid var(--accent);margin-bottom:12px}
.gh .gc{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mt{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;aspect-ratio:1/1;padding:12px;border-radius:16px;overflow:hidden;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(145deg,var(--t1),var(--t2));box-shadow:0 1px 3px rgba(0,0,0,.18);min-width:0;transition:transform .12s,filter .12s}
.mt:hover{transform:translateY(-2px);filter:brightness(1.08)}
.mt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mt::after{content:"";position:absolute;inset:auto -20% -38% -20%;height:50%;border-radius:50%;background:rgba(255,255,255,.08)}
.mt>*{position:relative;z-index:1;max-width:100%}
.mt .mn{font-family:var(--font-head);font-weight:800;font-size:clamp(1.05rem,4.8vw,1.35rem);line-height:1.08;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt .mn.sm{font-size:clamp(.9rem,3.8vw,1.05rem)}
.mt .md{font-size:.72rem;line-height:1.25;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt .mm{font-size:.76rem;letter-spacing:.04em;background:rgba(0,0,0,.22);padding:2px 10px;border-radius:99px}
.mc{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:84px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;text-decoration:none;color:var(--fg);min-width:0}
.mc:hover{border-color:var(--accent);background:var(--bg)}
.mc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mc .mn{font-family:var(--font-head);font-weight:700;font-size:.98rem;line-height:1.25;overflow-wrap:anywhere}
.mc .mm{font-size:.82rem;color:var(--muted)}
.card h3{font-size:1.15rem;font-weight:700}
.card .meta{font-size:.88rem;color:var(--muted)}
.card .desc{font-size:.92rem;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:6px}
.head .desc{color:var(--muted);max-width:65ch}
.srcs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.note{font-size:.9rem;background:var(--soft);border-radius:8px;padding:10px 14px;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{
  font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
}
.chip-btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c-info);flex:none}
.dot[data-cat="llama"]{background:var(--c-llama)} .dot[data-cat="agua"]{background:var(--c-agua)}
.dot[data-cat="sensor"]{background:var(--c-sensor)} .dot[data-cat="humos"]{background:var(--c-humos)}
.dot[data-cat="temp"]{background:var(--c-temp)} .dot[data-cat="gas"]{background:var(--c-gas)}
.dot[data-cat="electronica"]{background:var(--c-electronica)} .dot[data-cat="info"]{background:var(--c-info)}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"] .count{color:inherit;opacity:.75}
ul.codes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
ul.codes li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
ul.codes li:first-child{border-top:0}
.lcd{
  font-family:var(--font-lcd);font-size:1.35rem;letter-spacing:.06em;color:var(--lcd-fg);background:var(--lcd-bg);
  border-radius:6px;padding:6px 8px;text-align:center;text-shadow:0 0 8px color-mix(in srgb,var(--lcd-fg) 45%,transparent);
  line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;
}
.t{font-weight:600}
.h{font-size:.92rem;color:var(--muted);margin-top:2px}
.ficha{display:inline-block;margin-top:10px;margin-right:18px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.where{font-size:.82rem;color:var(--muted);margin-top:4px}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);white-space:nowrap;padding-top:4px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.top{display:block!important;padding:4px 0 2px}
.top .logo{display:block;height:34px;width:auto;max-width:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top .logo{filter:brightness(0) invert(.92)}}
:root[data-theme="dark"] .top .logo{filter:brightness(0) invert(.92)}
.lp{display:flex;gap:7px;align-items:flex-start}
.lp i{display:flex;flex-direction:column;align-items:center;gap:3px;font-style:normal;font-size:.68rem;color:var(--muted)}
.lp b{display:block;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
.lp .on.r b{background:#dc2626;border-color:#dc2626;box-shadow:0 0 7px rgba(220,38,38,.65)}
.lp .on.g b{background:#16a34a;border-color:#16a34a;box-shadow:0 0 7px rgba(22,163,74,.65)}
.lp .bl b{animation:lpb 1s steps(1) infinite}
.lp .bl.s2 b{animation-duration:2s}
@keyframes lpb{50%{background:var(--bg);box-shadow:none}}
@media (prefers-reduced-motion:reduce){.lp .bl b{animation:none;outline:2px dashed currentColor;outline-offset:2px}}
.lpc{font-size:.8rem;color:var(--muted);margin-top:6px;max-width:15ch;line-height:1.25}
ul.codes li.leds{grid-template-columns:132px minmax(0,1fr) auto}
@media (max-width:560px){ul.codes li.leds{grid-template-columns:132px minmax(0,1fr)}}
.navbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.navbar a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:1rem;text-decoration:none}
.navbar a:hover{border-color:var(--accent);color:var(--accent)}
.navbar a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
.foot{font-size:.82rem;color:var(--muted);max-width:70ch}
@media (max-width:560px){
  ul.codes li{grid-template-columns:76px minmax(0,1fr)}
  .tag{grid-column:2}
  .lcd{font-size:1.1rem}
}
</style>
<style>html{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

s-cerapuracu-smart-30", "junkers-ceraclassacu-comfort", "junkers-excellence-compact",  "junkers-cerapur-excellence", "junkers-cerapur-solar"]};

  function searchView(term){
    foot.textContent = "";
    var nq = norm(term), pq = plain(term), out = [], bySet = {};
    BRANDS.forEach(function(b){b.models.forEach(function(m){(bySet[m.set]=bySet[m.set]||[]).push({b:b,m:m});});});
    Object.keys(SETS).forEach(function(k){
      SETS[k].forEach(function(c){
        var hit = (nq && norm(c[0]).indexOf(nq)>-1) || plain(c[2]).indexOf(pq)>-1 || plain(c[3]||"").indexOf(pq)>-1;
        if(hit) out.push({c:c,uses:bySet[k]||[]});
      });

    var html = '<div class="head"><h2>Resultados para «'+esc(term)+'»</h2><p class="sub">'+out.length+' '+(out.length===1?'coincidencia':'coincidencias')+' en todas las marcas.</p></div>';
